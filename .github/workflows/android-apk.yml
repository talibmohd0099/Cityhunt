name: Build Android APK

# Wraps the game in a Capacitor Android app and builds an installable APK.
# Every push to main publishes it on the "apk-latest" release, so the newest
# APK is always at .../releases/download/apk-latest/LostCity.apk
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bundle the game for offline play
        run: |
          mkdir -p apk/www
          cp index.html apk/www/
          cp -r assets apk/www/
          cd apk/www
          # Download the three.js scripts into the app so it runs without internet
          grep -oE 'https://(cdnjs\.cloudflare\.com|cdn\.jsdelivr\.net)[^"]+\.js' index.html | sort -u | while read -r url; do
            case "$url" in
              *cdnjs.cloudflare.com*) out="vendor/$(basename "$url")" ;;
              *) out="vendor/${url#*three@0.128.0/}" ;;
            esac
            mkdir -p "$(dirname "$out")"
            curl -fsSL --retry 3 "$url" -o "$out"
            sed -i "s#$url#$out#" index.html
          done
          if grep -q '<script src="https://' index.html; then echo "Some scripts still load from the internet"; exit 1; fi
          find . -type f | sort

      - name: Create the Android project
        working-directory: apk
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "Lost City" com.talibmohd.lostcity --web-dir www
          npx cap add android
          # Vibration permission for the in-game haptics
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -q 'permission.VIBRATE' android/app/src/main/AndroidManifest.xml
          # Hide the status bar while playing
          sed -i 's#<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">#&\n        <item name="android:windowFullscreen">true</item>#' android/app/src/main/res/values/styles.xml
          grep -q windowFullscreen android/app/src/main/res/values/styles.xml || echo "::warning::Could not set the full-screen theme"
          npx cap sync android

      - name: Build the APK
        working-directory: apk/android
        run: |
          # Same signing key on every build, so a new APK installs over the old one
          mkdir -p ~/.android
          cp "$GITHUB_WORKSPACE/.github/android/debug.keystore" ~/.android/debug.keystore
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/LostCity.apk"
          ls -la "$GITHUB_WORKSPACE/LostCity.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LostCity-apk
          path: LostCity.apk

      - name: Publish on the apk-latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest LostCity.apk --target "$GITHUB_SHA" --prerelease \
            --title "Lost City APK (latest)" \
            --notes "Built from ${GITHUB_SHA::7}. Open this page on your Android phone, tap LostCity.apk, then allow installing from your browser when asked."
