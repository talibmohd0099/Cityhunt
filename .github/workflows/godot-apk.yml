name: Build Godot Android APK

# Exports the Godot version of the game (the godot/ folder) as an Android APK.
# Every push to main publishes it on the "godot-apk-latest" release, so the newest
# APK is always at .../releases/download/godot-apk-latest/LostCity-Godot.apk
on:
  push:
    branches: [main]
    paths: ["godot/**", ".github/workflows/godot-apk.yml"]
  pull_request:
    paths: ["godot/**", ".github/workflows/godot-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.2

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Godot and its Android export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android

      - name: Download Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          # Only the Android templates are needed out of the full template pack
          curl -fsSL --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o templates.tpz
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j templates.tpz templates/android_release.apk templates/android_debug.apk templates/version.txt -d "$dest"
          rm godot.zip templates.tpz
          ls -la ~/godot "$dest"

      - name: Point Godot at the Android SDK and Java
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.6.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          cat ~/.config/godot/editor_settings-4.6.tres
          ls "$ANDROID_HOME/build-tools"

      - name: Import the project
        working-directory: godot
        run: ~/godot/godot --headless --path . --import

      - name: Check the game scripts
        working-directory: godot
        run: |
          fail=0
          for f in scripts/*.gd; do
            out=$(~/godot/godot --headless --path . --check-only -s "res://$f" 2>&1)
            if echo "$out" | grep -q "SCRIPT ERROR"; then echo "$out"; fail=1; fi
          done
          exit $fail

      - name: Play full games automatically
        working-directory: godot
        run: |
          # Each hiding place once (the seed picks it), rescuing her, plus a run where the creature catches you
          for run in "win 3" "win 1" "win 2" "win 7" "win 8" "lose 4"; do
            set -- $run
            echo "::group::$1, seed $2"
            ~/godot/godot --headless --path . --fixed-fps 20 -s res://tests/autoplay.gd -- --mode=$1 --seed=$2
            echo "::endgroup::"
          done

      - name: Export the APK
        working-directory: godot
        env:
          # Same signing key as the web-version APK, so new builds install over old ones
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/.github/android/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          mkdir -p build
          ~/godot/godot --headless --path . --export-release "Android" build/LostCity-Godot.apk 2>&1 | grep -v "^ADDING:"
          test -s build/LostCity-Godot.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose build/LostCity-Godot.apk | head -5
          cp build/LostCity-Godot.apk "$GITHUB_WORKSPACE/LostCity-Godot.apk"
          ls -la "$GITHUB_WORKSPACE/LostCity-Godot.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LostCity-Godot-apk
          path: LostCity-Godot.apk

      - name: Publish on the godot-apk-latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete godot-apk-latest --yes --cleanup-tag || true
          gh release create godot-apk-latest LostCity-Godot.apk --target "$GITHUB_SHA" --prerelease \
            --title "Lost City, Godot version (latest APK)" \
            --notes "The Godot version of Lost City, built from ${GITHUB_SHA::7}. Open this page on your Android phone, tap LostCity-Godot.apk, then allow installing from your browser when asked. It installs next to the web-version app, as \"Lost City Godot\"."
